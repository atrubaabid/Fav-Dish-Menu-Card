<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fav Dish Menu Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="menu-container">

        <header>
            <h1>Fav Dish 🍴</h1>
            <h2>MENU CARD</h2>
            <p>Good Food • Happy Mood</p>
        </header>

        <div class="menu">
               <div class="card">
                <img src="https://images.unsplash.com/photo-1513104890138-7c749659a591?w=500" alt="Pizza">
                <div class="content">
                    <h3>Pepperoni Pizza</h3>
                    <p>Cheesy pizza with delicious toppings.</p>
                    <h2>$7.99</h2>
                    <button>Order Now</button>
                </div>
            </div>

         

            <div class="card">
                <img src="https://images.unsplash.com/photo-1473093295043-cdd812d0e601?w=500" alt="Pasta">
                <div class="content">
                    <h3>White Sauce Pasta</h3>
                    <p>Creamy, cheesy and full of flavor.</p>
                    <h2>$6.99</h2>
                    <button>Order Now</button>
                </div>
            </div>

            <div class="card">
                <img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=500" alt="Burger">
                <div class="content">
                    <h3>Classic Burger</h3>
                    <p>Juicy burger with fresh vegetables.</p>
                    <h2>$5.99</h2>
                    <button>Order Now</button>
                </div>
            </div>

            <div class="card">
                <img src="https://images.unsplash.com/photo-1513104890138-7c749659a591?w=500" alt="Pizza">
                <div class="content">
                    <h3>Pepperoni Pizza</h3>
                    <p>Cheesy pizza with delicious toppings.</p>
                    <h2>$7.99</h2>
                    <button>Order Now</button>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
